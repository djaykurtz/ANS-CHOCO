---
# Shared Chocolatey package catalog.
#
# This file is the common contract between chocoBuild and chocoDeploy.
# It describes package identity, approved deployment policy, acquisition method,
# source routing, and the versions staged on the mirror.
#
# It does not replace role-specific behavior. chocoDeploy still owns task_file,
# detection, conversion, removal, and pre_remove_script. chocoBuild still owns
# the internalization and wrapper execution details.
#
# Version meanings:
#   approved_version     the deployment floor or exact framework version
#   mirror_versions      exact versions staged or intended for the mirror
#   policy               minimum means upgrades may land newer; exact means the
#                        package policy expects this exact version
#
# Source meanings:
#   community            Chocolatey Community package internalized into mirror
#   wrapper              locally rebuilt package with an official vendor binary
#   firstparty           locally authored package from a vendor source
#   manual               no automated acquisition contract yet
#
# Date meanings on version_timeline entries:
#   public_feed_created  Chocolatey feed publication timestamp, not necessarily
#                        the upstream vendor release date
#   public_feed_updated  Last Chocolatey feed metadata update observed
#   candidate_staged     Date the candidate was added to this repository's build
#                        spec for mirror ingestion
#   mirror_ingested      Date the candidate package was successfully written to
#                        the trusted internal mirror
#   test_installed       Date the candidate was actually installed or upgraded
#                        on the approved TEST host
#   tested_on            Date the candidate passed a recorded TEST run
#   test_host             Inventory or host used for the validation
#   promoted_on          Date the candidate became the deployment floor; empty
#                        means it is not production policy yet
#   repo_first_seen      Historical package introduction date. Leave empty until
#                        established from repository history.

