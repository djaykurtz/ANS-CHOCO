  phase:
    phase_id: required
    purpose: required
    runs: ordered list
  run:
    run_id: required
    playbook: required
    inventory: required
    mode: optional
    target_software: explicit list or null
    remove_software: explicit list or null
    target_runtimes: explicit list or null
    reboot_policy: never|if_needed|always
    status: planned|running|complete|blocked|cancelled
