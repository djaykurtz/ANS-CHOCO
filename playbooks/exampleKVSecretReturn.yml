---
# exampleKVSecretReturn.yml
- hosts: localhost
  connection: local
  gather_facts: false

  roles:
    - role: getAzKVSecret
      vars:
        secret_name: 'svc-ansible'
  tasks:
    - name: Confirm secret retrieval without disclosing its value
      ansible.builtin.assert:
        that:
          - (hostvars['localhost']['keyVaultSecretValue'] | trim | length) > 0
        fail_msg: "No Key Vault secret was returned."
        quiet: true
      no_log: true
