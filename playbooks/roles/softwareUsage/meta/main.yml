galaxy_info:
  role_name: softwareUsage
  author: choco-fleet
  description: >
    Detect software USAGE on Windows hosts by reading Security event log
    process-creation events (EventID 4688). Per-app verdicts: used_recently,
    unused_in_window, audit_off. Honest about gaps; no NTFS fallback.
  license: internal
  min_ansible_version: "2.16"
  platforms:
    - name: Windows
      versions:
        - all
dependencies: []
