---
# Choco conversion mode:
# Detect target apps already present on the system, whether Chocolatey-managed
# or vendor-installed, then convert them to approved Chocolatey ownership.

- name: Choco Conversion | Debug target list
  ansible.builtin.debug:
    msg: >-
      Choco conversion mode targeting these apps:
      {{ detected_managed_apps | map(attribute='key') | list }}
  when: choco_deploy_console_verbose | default(false) | bool

- name: Choco Conversion | Run app-specific alignment for detected apps
  ansible.builtin.include_tasks: "{{ item.task_file }}"
  loop: "{{ detected_managed_apps }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    app_catalog_item: "{{ item }}"
