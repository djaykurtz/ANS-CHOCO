---
# One-time installed-program inventory.
# Uses uninstall registry locations instead of file-system scanning so convert
# mode stays reasonably fast after initial adoption.

- name: systemInventory | Query installed programs from uninstall registry
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'SilentlyContinue'
    $paths = @(
      'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
      'HKCU:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    )

    # Scan all loaded user profile hives under HKU for per-user installs
    $hkuBase = 'Registry::HKEY_USERS'
    Get-ChildItem $hkuBase -ErrorAction SilentlyContinue |
      Where-Object { $_.PSChildName -match '^S-1-5-21-' -and $_.PSChildName -notmatch '_Classes$' } |
      ForEach-Object {
        $sid = $_.PSChildName
        $paths += "Registry::HKEY_USERS\$sid\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
        $paths += "Registry::HKEY_USERS\$sid\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
      }

    $results = @()

    foreach ($path in $paths) {
      Get-ItemProperty -Path $path -ErrorAction SilentlyContinue |
        Where-Object { $_.DisplayName } |
        ForEach-Object {
          $results += [pscustomobject]@{
            display_name          = $_.DisplayName
            display_version       = $_.DisplayVersion
            publisher             = $_.Publisher
            quiet_uninstall       = $_.QuietUninstallString
            uninstall_string      = $_.UninstallString
            product_code          = $_.PSChildName
            install_location      = $_.InstallLocation
            windows_installer     = $_.WindowsInstaller
          }
        }
    }

    $results |
      Sort-Object display_name, display_version, publisher -Unique |
      ConvertTo-Json -Compress
  register: system_inventory_raw
  changed_when: false
  failed_when: false

- name: systemInventory | Parse installed-program inventory
  ansible.builtin.set_fact:
    system_installed_programs: >-
      {%- set raw = system_inventory_raw.stdout | default('') | trim -%}
      {%- if raw | length == 0 -%}
      []
      {%- else -%}
      {%- set parsed = raw | from_json -%}
      {{ [parsed] if parsed is mapping else parsed }}
      {%- endif -%}
  changed_when: false

- name: systemInventory | Build searchable program-name blob
  ansible.builtin.set_fact:
    system_installed_program_names_blob: "{{ system_installed_programs | map(attribute='display_name') | list | join('\n') }}"
  changed_when: false