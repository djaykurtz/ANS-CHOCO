---
# Choco baseline mode:
# Install or upgrade the full managed catalog to the approved spec,
# regardless of whether the software was previously present.

- name: Choco Baseline | Debug target list
  ansible.builtin.debug:
    msg: >-
      Choco baseline mode targeting these apps:
      {{ detected_managed_apps | map(attribute='key') | list }}
  when: choco_deploy_console_verbose | default(false) | bool

- name: Choco Baseline | Run app-specific alignment for full managed catalog
  ansible.builtin.include_tasks: "{{ item.task_file }}"
  loop: "{{ detected_managed_apps }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    app_catalog_item: "{{ item }}"
