---
- name: Apps | Align vim
  ansible.builtin.include_tasks: ops/install-one.yml
  vars:
    pkg:
      name: vim
      version: "{{ choco_target_min_version_map[app_catalog_item.key] | default(acceptable_versions.applications.vim.min_version) }}"
      registry_patterns: "{{ app_catalog_item.registry_patterns | default(['^vim', 'gvim']) }}"