---
- name: Apps | Align 7zip.install
  ansible.builtin.include_tasks: ops/install-one.yml
  vars:
    pkg:
      name: 7zip.install
      version: "{{ choco_target_min_version_map[app_catalog_item.key] | default(acceptable_versions.applications.sevenzip_install.min_version) }}"
      registry_patterns: "{{ app_catalog_item.registry_patterns | default(['7-zip']) }}"