---
- name: Apps | Align greenshot
  ansible.builtin.include_tasks: ops/install-one.yml
  vars:
    pkg:
      name: greenshot
      version: "{{ choco_target_min_version_map[app_catalog_item.key] | default(acceptable_versions.applications.greenshot.min_version) }}"
      # /ALLUSERS forces a machine-wide install. Greenshot 1.3.x defaults to
      # a per-user install (PrivilegesRequired=lowest), which would hide the
      # Start Menu entry from every account except the one that ran choco.
      install_args: '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /ALLUSERS'
      registry_patterns: "{{ app_catalog_item.registry_patterns | default(['greenshot']) }}"

- name: Apps | Suppress Greenshot first-run prompts (current + new users)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'SilentlyContinue'

    # Desired [Section] -> @{Key=Value} so new users get a clean, quiet first launch.
    $desired = [ordered]@{
      'Core'   = [ordered]@{
        'Language'          = 'en-US'
        'ShowFirstStart'    = 'False'
        'IsFirstLaunch'     = 'False'
        'CheckForUpdates'   = 'False'
        'UpdateCheckInterval' = '0'
        'BalloonTipNotify'  = 'False'
      }
      'Output' = [ordered]@{
        'OutputFileFormat'  = 'png'
      }
    }

    function Merge-GreenshotIni {
      param([Parameter(Mandatory)] [string] $IniPath, [Parameter(Mandatory)] [hashtable] $Desired)

      $dir = Split-Path -Parent $IniPath
      if (-not (Test-Path $dir)) { New-Item -Path $dir -ItemType Directory -Force | Out-Null }

      $lines = if (Test-Path $IniPath) { Get-Content -Path $IniPath -Encoding UTF8 } else { @() }

      # Parse existing into ordered section map.
      $map = [ordered]@{}
      $currentSection = $null
      foreach ($raw in $lines) {
        $line = $raw.TrimEnd()
        if ($line -match '^\s*\[(.+?)\]\s*$') {
          $currentSection = $matches[1]
          if (-not $map.Contains($currentSection)) { $map[$currentSection] = [ordered]@{} }
          continue
        }
        if ($line -match '^\s*([^;=#][^=]*?)\s*=\s*(.*)$' -and $currentSection) {
          $map[$currentSection][$matches[1].Trim()] = $matches[2].Trim()
        }
      }

      # Merge desired keys (overwrite to enforce policy).
      foreach ($section in $Desired.Keys) {
        if (-not $map.Contains($section)) { $map[$section] = [ordered]@{} }
        foreach ($k in $Desired[$section].Keys) {
          $map[$section][$k] = $Desired[$section][$k]
        }
      }

      # Re-emit.
      $sb = New-Object System.Text.StringBuilder
      foreach ($section in $map.Keys) {
        [void] $sb.AppendLine("[$section]")
        foreach ($k in $map[$section].Keys) {
          [void] $sb.AppendLine("$k=$($map[$section][$k])")
        }
        [void] $sb.AppendLine()
      }
      Set-Content -Path $IniPath -Value $sb.ToString().TrimEnd() -Encoding UTF8
    }

    $targets = @()
    # Current run-as user (Ansible/WinRM session).
    if ($env:APPDATA) { $targets += (Join-Path $env:APPDATA 'Greenshot\Greenshot.ini') }
    # Default profile -- inherited by every NEW user that signs in.
    $defaultRoaming = Join-Path $env:SystemDrive 'Users\Default\AppData\Roaming'
    if (Test-Path (Split-Path $defaultRoaming -Parent)) {
      $targets += (Join-Path $defaultRoaming 'Greenshot\Greenshot.ini')
    }

    foreach ($t in ($targets | Select-Object -Unique)) {
      Merge-GreenshotIni -IniPath $t -Desired $desired
      "Configured: $t"
    }
  changed_when: false
  failed_when: false